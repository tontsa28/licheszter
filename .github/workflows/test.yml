name: licheszter integration tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 6"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      lila:
        image: ghcr.io/lichess-org/lila-docker:main
        options: --restart=always --name lila
        ports:
          - 8080:8080
      lila-bots:
        image: python:latest
        options: -t --name lila-bots --entrypoint "/bin/sh"
      lila-engine:
        image: ghcr.io/lichess-org/lila-engine:latest
        options: --restart=always --name lila-engine
        ports:
          - 9666:9666
        command: --bind 0.0.0.0:9666 --mongodb mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Open MongoDB to all containers & restart Lila
        run: docker exec lila sed -i 's/mongod --logpath/mongod --bind_ip_all --logpath/' /etc/supervisor/conf.d/supervisord.conf && docker restart lila

      - name: Connect to bot accounts
        run: docker cp ${{ github.workspace }}/.github/docker/entrypoint.sh lila-bots:/entrypoint.sh && docker exec -d lila-bots ./entrypoint.sh && sleep 5s

      - name: Run all integration tests
        env:
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: cargo test --release --all-features -- --test-threads=1
